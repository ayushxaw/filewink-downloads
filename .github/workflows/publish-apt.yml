name: Publish downloads website and signed APT repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apt/**'
      - 'site/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/publish-apt.yml'

permissions:
  contents: read

concurrency:
  group: filewink-apt-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test repository validation
        run: python3 -m unittest discover -s tests -v
      - name: Verify signed metadata and assemble packages
        run: python3 tools/assemble_apt.py --output _site --website site --fingerprint B63801ACA2BA93F0A7450BACB04130F8E6E8A88F
      - name: Check homepage links and download boundaries
        run: python3 tools/check_download_site.py --site _site
      - name: Exercise APT and reject altered metadata
        run: python3 tools/check_apt_client.py --site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    name: Deploy homepage and unchanged signed feed
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish repository
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment separately from live checks
        env:
          FILEWINK_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo '### Pages deployment completed'
            echo "Published URL: $FILEWINK_SITE_URL"
            echo 'The homepage and signed /apt/ tree were deployed together.'
            echo 'The independent HTTPS homepage and live signed-APT jobs determine availability; deployment alone is not a live-check pass.'
          } >> "$GITHUB_STEP_SUMMARY"
  verify-site:
    name: Verify public homepage over HTTPS
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published homepage and assets without authentication
        env:
          FILEWINK_SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, time, urllib.parse, urllib.request
          base = os.environ['FILEWINK_SITE_URL'].rstrip('/') + '/'
          if urllib.parse.urlsplit(base).scheme != 'https':
              raise SystemExit('Pages reports an HTTP URL. Deployment succeeded, but HTTPS verification is blocked until docs/DOMAIN_SETUP.md is completed.')
          class HTTPSOnly(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, target):
                  if urllib.parse.urlsplit(target).scheme != 'https':
                      raise RuntimeError('The public homepage redirected away from HTTPS.')
                  return super().redirect_request(request, response, code, message, headers, target)
          opener = urllib.request.build_opener(HTTPSOnly())
          for relative in ('index.html', 'styles.css', 'script.js', 'assets/filewink.svg'):
              expected = hashlib.sha256(pathlib.Path('site', relative).read_bytes()).hexdigest()
              for attempt in range(8):
                  try:
                      request = urllib.request.Request(urllib.parse.urljoin(base, relative), headers={'User-Agent': 'Filewink-site-check/1'})
                      with opener.open(request, timeout=30) as response:
                          actual = hashlib.sha256(response.read()).hexdigest()
                      if actual != expected:
                          raise RuntimeError('Published content differs: ' + relative)
                      print('Verified published file:', relative)
                      break
                  except Exception:
                      if attempt == 7:
                          raise
                      time.sleep(5)
          PY
      - name: Record the independent homepage result
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          echo "### Live HTTPS homepage: $CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo 'This result does not change the completed deployment or establish signed APT installation health.' >> "$GITHUB_STEP_SUMMARY"
  verify-install:
    name: Verify installation through the live signed APT feed
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the published setup package
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          manifest = json.loads(pathlib.Path('apt/manifest.json').read_text())
          package = next(p for p in manifest['packages'] if p['name'] == 'filewink-archive-keyring')
          path = pathlib.Path(package['filename']).name
          url = 'https://ayushxaw.github.io/filewink-downloads/apt/' + package['filename']
          subprocess.run(['curl', '--fail', '--location', '--proto', '=https', '--proto-redir', '=https', '--retry', '5', '--output', path, url], check=True)
          data = pathlib.Path(path).read_bytes()
          assert len(data) == package['size']
          assert hashlib.sha256(data).hexdigest() == package['sha256']
          pathlib.Path('setup-package.txt').write_text(path)
          PY
      - name: Use Ubuntu and Filewink sources in this disposable runner
        run: |
          # Exclude unrelated vendor repositories shipped in the runner image.
          sudo mkdir -p "$RUNNER_TEMP/image-apt-sources"
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -exec mv -t "$RUNNER_TEMP/image-apt-sources" {} +
          if [ -f /etc/apt/sources.list ]; then
            sudo mv /etc/apt/sources.list "$RUNNER_TEMP/image-apt-sources/"
          fi
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo tee /etc/apt/apt.conf.d/99-filewink-ci-network > /dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          EOF
      - name: Install through the live signed APT feed
        run: |
          sudo apt-get install -y "./$(cat setup-package.txt)"
          sudo apt-get -o APT::Update::Error-Mode=any update
          apt-cache policy filewink filewink-archive-keyring
          sudo apt-get install -y filewink
      - name: Check upgrade selection from an older installed version
        run: |
          # A disposable control-only package exercises APT's update policy.
          # It is never published and contains no app files.
          sudo apt-get remove -y filewink
          mkdir -p "$RUNNER_TEMP/old-filewink/DEBIAN"
          cat > "$RUNNER_TEMP/old-filewink/DEBIAN/control" <<'EOF'
          Package: filewink
          Version: 0.0.0
          Architecture: amd64
          Maintainer: Filewink test <test@example.invalid>
          Description: Disposable APT upgrade fixture
          EOF
          dpkg-deb --root-owner-group --build "$RUNNER_TEMP/old-filewink" "$RUNNER_TEMP/old-filewink.deb"
          sudo dpkg -i "$RUNNER_TEMP/old-filewink.deb"
          apt-get --simulate upgrade | tee "$RUNNER_TEMP/upgrade-plan.txt"
          grep '^Inst filewink \[0.0.0\]' "$RUNNER_TEMP/upgrade-plan.txt"
          sudo apt-get install -y --only-upgrade filewink
      - name: Check installed tools and packaged app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 180s filewink --packaging-smoke-test --require-tools --report "$RUNNER_TEMP/filewink-apt-smoke.json"
          cat "$RUNNER_TEMP/filewink-apt-smoke.json"
      - name: Remove app and update source
        run: |
          sudo apt-get remove -y filewink
          sudo apt-get purge -y filewink-archive-keyring
          test ! -e /etc/apt/sources.list.d/filewink.sources
          test ! -e /usr/share/keyrings/filewink-archive-keyring.asc
      - name: Record the independent live APT result
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          echo "### Live signed APT install: $CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo 'Only this live-feed lifecycle establishes installation/update health. The local signed-feed tests and Pages deployment are reported separately.' >> "$GITHUB_STEP_SUMMARY"
